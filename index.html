<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Wallpapers 4K - Premium Stock Images</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0b0f19; color: #fff; padding: 20px; }
        header { text-align: center; padding: 40px 20px; background: linear-gradient(135deg, #1e293b, #0f172a); border-radius: 16px; margin-bottom: 30px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
        header h1 { font-size: 2.5rem; color: #38bdf8; margin-bottom: 10px; font-weight: 700; }
        header p { color: #94a3b8; font-size: 1.1rem; }
        .gallery-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 25px; max-width: 1400px; margin: 0 auto; }
        .card { background-color: #1e293b; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.2); transition: transform 0.3s ease, box-shadow 0.3s ease; display: flex; flex-direction: column; }
        .card:hover { transform: translateY(-5px); box-shadow: 0 8px 25px rgba(56, 189, 248, 0.2); }
        .card img { width: 100%; height: 380px; object-fit: cover; background-color: #0f172a; }
        .card-body { padding: 15px; display: flex; flex-direction: column; gap: 10px; margin-top: auto; }
        .download-btn { display: block; text-align: center; background: linear-gradient(135deg, #38bdf8, #0284c7); color: #fff; font-weight: 600; padding: 12px; border-radius: 8px; text-decoration: none; transition: opacity 0.2s; }
        .download-btn:hover { opacity: 0.9; }
        footer { text-align: center; padding: 40px 20px; color: #64748b; font-size: 0.9rem; margin-top: 50px; border-top: 1px solid #1e293b; }
    </style>
</head>
<body>

    <header>
        <h1>AI Wallpapers 4K</h1>
        <p>Explore & Download Premium AI Generated Wallpapers for Free</p>
    </header>

    <div class="gallery-container" id="gallery">
        <!-- Images will load automatically here -->
    </div>

    <footer>
        <p>&copy; 2026 AI Wallpapers 4K. Built for Speed.</p>
    </footer>

    <script>
        // Automatic Image Fetcher via GitHub API
        const repoOwner = 'aiwallpapers4k';
        const repoName = 'aiwallpapers4k.github.io';
        const folderPath = 'images';

        async function loadImages() {
            const gallery = document.getElementById('gallery');
            try {
                const response = await fetch(`https://github.com{repoOwner}/${repoName}/contents/${folderPath}`);
                const files = await response.json();
                
                // Filter only image files and skip .gitkeep
                const imageFiles = files.filter(file => 
                    file.name !== '.gitkeep' && 
                    (file.name.endsWith('.jpg') || file.name.endsWith('.jpeg') || file.name.endsWith('.png') || file.name.endsWith('.webp'))
                );

                if(imageFiles.length === 0) {
                    gallery.innerHTML = '<p style="grid-column: 1/-1; text-align:center; color:#94a3b8;">No wallpapers found in the folder yet.</p>';
                    return;
                }

                imageFiles.forEach(file => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    
                    // Premium UI Card Setup
                    card.innerHTML = `
                        <img src="${file.download_url}" alt="Premium Wallpaper" loading="lazy">
                        <div class="card-body">
                            <a href="${file.download_url}" download="${file.name}" target="_blank" class="download-btn">Download 4K</a>
                        </div>
                    `;
                    gallery.appendChild(card);
                });
            } catch (error) {
                console.error("Error loading images:", error);
                gallery.innerHTML = '<p style="grid-column: 1/-1; text-align:center; color:#ef4444;">Failed to load wallpapers. Please refresh.</p>';
            }
        }

        // Initialize Gallery
        loadImages();
    </script>
</body>
</html>
